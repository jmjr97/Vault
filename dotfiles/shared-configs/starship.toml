# ======================================================================
# Config: Starship
# File: ~/.config/starship.toml
# Platform: shared
# Link: https://github.com/starship/starship
# ======================================================================

# colors used:
# blue: #89b4fa
# red: #f38ba8
# yellow: #fab387
# purple: #cab6f7

format = """
$jobs\
$hostname\
[\uf07c  ](#89b4fa)\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""
command_timeout = 500

[hostname]
ssh_only = false
format = '[$ssh_symbol](#89b4fa)[$hostname](#89b4fa) '

[directory]
style = '#89b4fa'
read_only_style = '#f38ba8' 
read_only = '󰌾 '
format = '[$read_only]($read_only_style)[$path]($style)'
truncation_length = 10
truncation_symbol = '…/'

[character]
success_symbol = '[❯](#89b4fa)'
error_symbol = '[❯](#f38ba8)'
vimcmd_symbol = '[❮](#fab387)'

[git_branch]
format = ' [$symbol $branch]($style) '
style = '#cab6f7'
symbol = '󰊢'
# symbol = ''

[git_status]
format = '[[($conflicted$untracked$modified$staged$renamed$deleted)](#f38ba8)($ahead_behind$stashed)]($style)'
style = '#89b4fa'
conflicted = ' '
untracked = '󰰩 ' 
modified = '󰰑 '
staged = '󰰣 '
renamed = '​'
deleted = '​'
stashed = '≡ '

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = 'bright-black'

[cmd_duration]
format = ' [$duration]($style) '
style = '#fab387'

[python]
format = '[$virtualenv]($style) '
style = 'bright-black'

[jobs]
symbol = ' '
style = '#f38ba8'
number_threshold = 1
format = '[$symbol]($style)'
